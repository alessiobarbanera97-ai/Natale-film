<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12332d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Christmas Movie Night</title><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--pine:#12332d;--pine2:#1d4b3e;--red:#b83d45;--gold:#e4c98d;--cream:#f7f1e5;--ink:#21352e;--muted:#64766d}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(145deg,#102d28,#245541);color:#fff;padding:20px 18px 18px;border-radius:0 0 26px 26px}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.07em;font-size:13px}.snow{font-size:24px}
h1{font-family:Georgia,serif;text-align:center;color:#f7e9cb;font-size:30px;margin:18px 0 4px}.sub{text-align:center;color:#d6e5da;font-size:12px;letter-spacing:.12em}
.countdown{display:flex;gap:10px;margin-top:18px}.stat{background:#ffffff16;border:1px solid #ffffff1e;border-radius:15px;padding:12px;text-align:center;flex:1}.stat b{display:block;font-size:23px;color:#f7e9cb}.stat span{font-size:11px;color:#dce8df}
main{max-width:760px;margin:auto;padding:15px 14px 95px}.profiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.profile{border:2px solid transparent;background:#fff;border-radius:15px;padding:12px;font-weight:700}.profile.active{border-color:#38845c;background:#e5f1e5}.profile span{display:block;font-size:23px;margin-bottom:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e0d6;display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:#61736b;font-size:10px;font-weight:700;padding:6px 4px}nav button.active{color:#1e7048}nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
h2{font-family:Georgia,serif;color:var(--pine);margin:18px 0 8px}.hint{font-size:13px;color:var(--muted);line-height:1.5}.card{background:#fff;border-radius:18px;overflow:hidden;margin:13px 0;box-shadow:0 5px 18px #163a2910}.poster{height:145px;display:grid;place-items:center;color:#fff;font-size:52px;background:radial-gradient(circle at 30% 20%,#729c81,#173b32 65%,#102720);position:relative}.poster:after{content:"✦  ❄  ✧  ❄  ✦";position:absolute;bottom:12px;font-size:15px;color:#f5e5bd;letter-spacing:9px}.cardbody{padding:14px}.meta{font-size:11px;color:#78877f;text-transform:uppercase;letter-spacing:.08em}.title{font-family:Georgia,serif;font-size:21px;font-weight:700;margin:5px 0 12px}.lights{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.light{border-radius:12px;padding:9px;text-align:center;color:white;background:#aeb5b1}.light.yes{background:#27834d}.light.no{background:#b83d45}.light .flake{font-size:25px;display:block}.light small{font-size:10px;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:12px;padding:12px 10px;font-weight:800;font-size:13px;cursor:pointer}.green{background:#27834d;color:#fff}.red{background:#b83d45;color:#fff}.dark{background:var(--pine);color:#fff}.soft{background:#e8eee8;color:#234536}.gold{background:#e5cc91;color:#46371b}.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:#fff;border-radius:17px;padding:15px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row strong{font-size:14px}.input{width:100%;padding:12px;border:1px solid #d9ded7;border-radius:11px;font:inherit;margin:7px 0}.tag{font-size:11px;border-radius:99px;background:#edf2ed;padding:5px 9px;color:#42614e}.empty{text-align:center;padding:28px 12px;color:#64766d}.snowrate{font-size:25px;border:0;background:none;padding:2px;cursor:pointer;filter:grayscale(1);opacity:.45}.snowrate.on{filter:none;opacity:1}
.modal{position:fixed;inset:0;background:#081b16e8;z-index:10;display:none;align-items:center;justify-content:center;padding:22px}.modal.show{display:flex}.gift{max-width:420px;width:100%;background:#f8f0df;border-radius:24px;text-align:center;padding:25px;box-shadow:0 0 70px #f3d99b55}.gift .boxemoji{font-size:72px}.gift h2{font-size:28px}.gift p{color:#52675b}.small{font-size:11px;color:#7c8981}.dangerlink{color:#a43c42;border:0;background:none;font-weight:700}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#173c30;color:#fff;border-radius:30px;padding:11px 17px;font-size:12px;display:none;z-index:20;max-width:90%;text-align:center}
@media(min-width:600px){.poster{height:190px}}
</style></head>
<body>
<header><div class="top"><div class="brand">❄ CHRISTMAS MOVIE NIGHT</div><div class="snow">🎅</div></div><h1>Alessio & Giada</h1><div class="sub">YOUR LITTLE CHRISTMAS TRADITION</div><div class="countdown"><div class="stat"><b id="today">—</b><span>OGGI</span></div><div class="stat"><b id="days">—</b><span>GIORNI A NATALE</span></div><div class="stat"><b id="round">1</b><span>ROUND</span></div></div></header>
<main>
<div class="profiles"><button class="profile active" data-profile="Alessio"><span>🧑🏻</span>Alessio</button><button class="profile" data-profile="Giada"><span>👩🏻</span>Giada</button></div>
<div id="content"></div>
</main>
<nav><button data-tab="proposte" class="active"><i>🎬</i>PROPOSTE</button><button data-tab="libreria"><i>🎞️</i>LIBRERIA</button><button data-tab="visti"><i>🍿</i>VISTI</button><button data-tab="analytics"><i>📊</i>ANALYTICS</button><button data-tab="impostazioni"><i>⚙️</i>SETUP</button></nav>
<div class="modal" id="giftModal"><div class="gift"><div class="boxemoji">🎁✨</div><h2>UN DOPPIO SÌ!</h2><p id="winnerTitle"></p><p>Alessio e Giada hanno scelto lo stesso film. La magia ha funzionato!</p><button class="btn green" id="confirmBtn">CONFERMA – LO VEDIAMO!</button><p class="small">Dopo la visione, lo segnerete come visto e potrete dare i vostri voti.</p><button class="dangerlink" id="closeGift">Chiudi</button></div></div>
<div id="toast"></div>
<script>alert("TEST HTML FUNZIONANTE");</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20261101"></script>
</body></html>
