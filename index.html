<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3243a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Film Natale">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Film sotto l'albero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: due schermate "telefono" affiancate (Alessio e Giada), con luci natalizie in cima e card film illustrate.
   Palette: abete profondo, bacca rossa, oro e neve. Font: Emilys Candy per i titoli, Nunito per il testo. */
:root {
  --bg: #e8f2ec;
  --surface: #ffffff;
  --surface2: #f1f8f3;
  --fg: #16302a;
  --muted: #52726a;
  --line: #cde0d4;
  --accent: #b3243a;
  --accent-ink: #ffffff;
  --pine: #1b7a54;
  --pine-soft: #dcf1e6;
  --berry: #c0283d;
  --berry-soft: #fadfe3;
  --gold: #b97d08;
  --housing: #14302a;
  --sm-on: #ffffff;
  --sm-line: #3b7da8;
  --wire: #1f5a3f;
  --av-a: #1b7a54;
  --av-g: #c0283d;
  --shadow: 0 12px 32px rgba(22, 60, 45, .16);
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1d17; --surface: #12302a; --surface2: #183b33; --fg: #eef7f1; --muted: #9bbdb0;
    --line: #2a5246; --accent: #ff6b7d; --accent-ink: #2a0a10; --pine: #43d39a; --pine-soft: #14402f;
    --berry: #ff7083; --berry-soft: #43202b; --gold: #f2c14e; --housing: #06130e; --sm-on: #f2f8fc;
    --sm-line: #8ccaf2; --wire: #3a9a70; --av-a: #2f9b6e; --av-g: #d9485d; --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1d17; --surface: #12302a; --surface2: #183b33; --fg: #eef7f1; --muted: #9bbdb0;
  --line: #2a5246; --accent: #ff6b7d; --accent-ink: #2a0a10; --pine: #43d39a; --pine-soft: #14402f;
  --berry: #ff7083; --berry-soft: #43202b; --gold: #f2c14e; --housing: #06130e; --sm-on: #f2f8fc;
  --sm-line: #8ccaf2; --wire: #3a9a70; --av-a: #2f9b6e; --av-g: #d9485d; --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  font-synthesis: none;
  margin: 0;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1000px; margin-inline: auto; }

/* barra anteprima */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  padding-block: 12px;
}
.brand { font-family: var(--font-display); font-size: 32px; font-weight: 400; line-height: 1.1; color: var(--berry); }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; width: 100%; max-width: 360px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.note { color: var(--muted); font-size: 13px; padding-bottom: 14px; }

/* pannelli telefono */
.panes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; justify-items: center; }
@media (min-width: 900px) { .panes.two { grid-template-columns: repeat(2, minmax(0, 440px)); justify-content: center; align-items: start; } }
.phone { width: 100%; max-width: 440px; min-width: 0; background: var(--surface); border: 3px solid var(--berry); outline: 3px solid var(--pine); outline-offset: -9px; border-radius: 30px; box-shadow: var(--shadow); padding: 0 16px 22px; overflow: hidden; }
.garland { display: block; width: calc(100% + 32px); margin-inline: -16px; height: auto; }
.garland .wire { fill: none; stroke: var(--wire); stroke-width: 2; }
.garland .bulb { animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
.app-head { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.who { display: flex; align-items: center; gap: 12px; }
.av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-size: 26px; flex: none; border: 3px solid var(--gold); }
.av.A { background: var(--av-a); } .av.G { background: var(--av-g); }
.hi { font-family: var(--font-display); font-size: 28px; font-weight: 400; line-height: 1.1; }
.sub { color: var(--muted); font-size: 13px; }

.cal { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface2); }
.cal-top { background: var(--berry); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 7px 14px; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 800; position: relative; }
.cal-top::before, .cal-top::after { content: ""; position: absolute; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); }
.cal-top::before { left: 26%; } .cal-top::after { right: 26%; }
.cal-body { display: flex; align-items: center; gap: 14px; padding: 8px 16px 10px; }
.cal-day { font-family: var(--font-display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--berry); }
.cal-wd { text-transform: capitalize; font-weight: 800; font-size: 18px; }
.cal-full { color: var(--muted); font-size: 13px; }
.count { display: flex; align-items: center; gap: 12px; background: var(--pine-soft); border: 1px solid var(--pine); border-radius: 14px; padding: 8px 14px; }
.count svg { width: 28px; height: 28px; flex: none; color: var(--pine); }
.count .n { font-family: var(--font-display); font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--pine); }
.count .l { font-weight: 800; }
.candy { height: 9px; border-radius: 999px; margin-top: 2px; background: repeating-linear-gradient(-45deg, var(--berry) 0 9px, #ffffff 9px 18px); border: 1px solid var(--line); }

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-block: 14px; background: var(--surface2); padding: 4px; border-radius: 14px; }
.tabs button { border: 0; background: transparent; padding: 9px 2px; border-radius: 10px; font-size: 13px; font-weight: 800; color: var(--muted); min-height: 42px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sec-head h2 { font-family: var(--font-display); font-size: 25px; font-weight: 400; line-height: 1.1; }
.ghost { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; min-height: 36px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* illustrazioni */
.art { position: relative; aspect-ratio: 16 / 7; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--surface2); }
.art svg { display: block; width: 100%; height: 100%; }
.art .tag { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: rgba(8, 20, 16, .55); padding: 2px 9px; border-radius: 999px; }
.thumb { flex: none; width: 76px; aspect-ratio: 16 / 11; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.thumb svg { display: block; width: 100%; height: 100%; }

/* card proposta */
.pcard { border: 2px solid var(--line); border-radius: 20px; padding: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; transition: border-color .25s, background .25s; }
.pcard.go { border-color: var(--pine); background: var(--pine-soft); }
.pcard.stop { border-color: var(--berry); background: var(--berry-soft); }
.pcard-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-inline: 4px; }
.pcard-info { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ptitle { font-family: var(--font-display); font-size: 25px; font-weight: 400; line-height: 1.1; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); }
.pcard.go .chip, .pcard.stop .chip { background: var(--surface); }
.lights { display: flex; gap: 8px; flex: none; }
.light { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); }
.housing { background: var(--housing); border-radius: 14px; padding: 5px; width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--line); }
.flake { width: 34px; height: 34px; color: #4a5d70; transition: color .25s, filter .25s; }
.flake.go { color: #34e59a; filter: drop-shadow(0 0 5px #34e59a); }
.flake.stop { color: #ff5468; filter: drop-shadow(0 0 5px #ff5468); }
.votes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-inline: 4px; padding-bottom: 4px; }
.vbtn { border: 0; border-radius: 12px; min-height: 46px; padding: 8px 6px; font-weight: 800; font-size: 14px; color: #fff; transition: opacity .2s, box-shadow .2s; }
.vbtn.yes { background: #1b8a5a; } .vbtn.no { background: #c0283d; }
.vbtn[aria-pressed="false"].dim { opacity: .5; }
.vbtn.yes[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #1b8a5a; }
.vbtn.no[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #c0283d; }

/* lista */
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 12px; }
.add input, .add select { min-width: 0; min-height: 44px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); border-radius: 12px; padding: 0 12px; font: inherit; }
.add .full { grid-column: 1 / -1; }
.add .primary { grid-column: 1 / -1; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; min-height: 44px; font-weight: 800; padding: 0 16px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); }
.row .t { min-width: 0; flex: 1; }
.row .t b { display: block; overflow-wrap: anywhere; }
.row .t span { color: var(--muted); font-size: 13px; }
.rm { flex: none; border: 1px solid var(--berry); color: var(--berry); background: transparent; border-radius: 10px; min-height: 38px; padding: 0 12px; font-weight: 700; font-size: 13px; }
.empty { color: var(--muted); text-align: center; padding: 22px 8px; border: 1px dashed var(--line); border-radius: 14px; }

/* visti */
.seen { border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 12px; background: var(--surface2); display: flex; flex-direction: column; gap: 8px; }
.seen-head { display: flex; gap: 12px; align-items: center; }
.seen h3 { font-family: var(--font-display); font-size: 24px; font-weight: 400; line-height: 1.1; overflow-wrap: anywhere; }
.seen .meta { color: var(--muted); font-size: 13px; }
.rate { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rate .nm { font-weight: 700; font-size: 14px; min-width: 56px; }
.rate .stars { display: flex; gap: 2px; }
.sm { width: 26px; height: 30px; fill: none; stroke: var(--line); stroke-width: 1.3; --carrot: transparent; --hat: transparent; }
.sm.on { fill: var(--sm-on); stroke: var(--sm-line); --carrot: #f08a24; --hat: var(--berry); }
.sbtn { border: 0; background: transparent; padding: 4px 1px; min-height: 40px; border-radius: 8px; }
.avg { display: flex; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 8px; font-weight: 800; }
.avg .num { font-family: var(--font-display); font-size: 28px; color: var(--gold); }

/* statistiche */
.stat { display: flex; flex-direction: column; gap: 5px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.stat:last-child { border-bottom: 0; }
.stat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stat-top b { overflow-wrap: anywhere; }
.stat-top .c { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; flex: none; color: var(--berry); }
.track { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: repeating-linear-gradient(-45deg, var(--berry) 0 8px, #ffffff 8px 16px); }
.stat small { color: var(--muted); font-size: 12.5px; }

/* regalo */
.gift { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(4, 16, 12, .8); overflow-y: auto; }
.gift[hidden] { display: none; }
.gift-card { width: 100%; max-width: 380px; background: var(--surface); border-radius: 26px; padding: 22px 16px 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; border: 3px solid var(--gold); }
.kicker { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--pine); }
.stage { position: relative; height: 270px; display: grid; place-items: center; }
.box { position: absolute; width: 140px; height: 140px; bottom: 60px; animation: shake .5s ease-in-out, boxout .35s .95s forwards; transform-origin: 50% 100%; }
.box .lid { animation: lid .6s .55s cubic-bezier(.2, .8, .3, 1) forwards; transform-origin: 70px 40px; }
.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.burst i { position: absolute; left: -4px; top: -4px; width: 9px; height: 14px; border-radius: 2px; background: var(--c); opacity: 0; animation: fly 1.1s cubic-bezier(.1, .7, .3, 1) forwards; }
.reveal { position: relative; width: 100%; opacity: 0; transform: scale(.3) translateY(40px); animation: pop .6s .9s cubic-bezier(.2, 1.3, .4, 1) forwards; background: var(--pine-soft); border: 2px solid var(--pine); border-radius: 20px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.reveal .ptitle { font-size: 32px; padding-inline: 4px; }
.gift-actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
.confirm { background: var(--pine); color: #fff; border: 0; border-radius: 14px; min-height: 50px; font-weight: 800; font-size: 16px; }
.undo { background: transparent; border: 1px solid var(--line); border-radius: 14px; min-height: 44px; font-weight: 700; color: var(--muted); }
@keyframes shake { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-7deg); } 35% { transform: rotate(7deg); } 55% { transform: rotate(-5deg); } 75% { transform: rotate(4deg); } }
@keyframes lid { to { transform: translate(14px, -120px) rotate(28deg); opacity: 0; } }
@keyframes boxout { to { opacity: 0; transform: scale(.7); } }
@keyframes pop { to { opacity: 1; transform: none; } }
@keyframes fly { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 70px)) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) {
  .box, .burst { display: none; }
  .reveal { opacity: 1; transform: none; animation: none; }
  .pcard { transition: none; }
  .garland .bulb { animation: none; }
}

.peek { position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); bottom: 0; z-index: 40; width: 160px; pointer-events: none; transform: translateY(108%); transition: transform .6s cubic-bezier(.2, 1.2, .4, 1); display: flex; flex-direction: column; align-items: flex-end; }
.peek.show { transform: translateY(0); }
.peek svg { width: 120px; height: 120px; display: block; }
.bubble { background: var(--surface); color: var(--fg); border: 2px solid var(--berry); border-radius: 14px; padding: 6px 10px; font-weight: 800; font-size: 13px; margin-bottom: 4px; max-width: 160px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.toast[hidden] { display: none; }
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="snowman" viewBox="0 0 24 28">
    <circle cx="12" cy="20" r="7"/>
    <circle cx="12" cy="10.5" r="4.8"/>
    <rect x="8.6" y="2" width="6.8" height="3.4" rx="1" fill="var(--hat)"/>
    <rect x="6.8" y="5" width="10.4" height="1.6" rx=".8" fill="var(--hat)"/>
    <path d="M12 10.4l4.6 1.1-4.6 1.1z" fill="var(--carrot)" stroke="none"/>
  </symbol>
  <symbol id="flakeico" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <g id="arm"><path d="M20 3V37"/><path d="M20 10l-4-4M20 10l4-4M20 30l-4 4M20 30l4 4"/></g>
      <use href="#arm" transform="rotate(60 20 20)"/>
      <use href="#arm" transform="rotate(120 20 20)"/>
    </g>
  </symbol>
</svg>

<canvas id="snow" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="topbar">
    <h1 class="brand">Film sotto l'albero</h1>
    <div class="seg" role="group" aria-label="Anteprima">
      <button data-act="view" data-v="A" aria-pressed="false">Alessio</button>
      <button data-act="view" data-v="G" aria-pressed="false">Giada</button>
      <button data-act="view" data-v="both" aria-pressed="false">Affiancate</button>
    </div>
  </header>
  <p class="note">Lista di partenza con 12 titoli natalizi: cambiala dalla sezione Lista. Alessio e Giada condividono voti e film visti, e i dati restano salvati su questo dispositivo. <button class="ghost" id="resetBtn" data-act="reset">Ricomincia da capo</button></p>
  <main class="panes" id="panes"></main>
</div>

<div class="gift" id="gift" hidden role="dialog" aria-modal="true" aria-label="Film scelto"></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="peek" id="peek" aria-hidden="true"><div class="bubble" id="bubble"></div><div id="char"></div></div>

<script>
(function () {
  var NAMES = { A: 'Alessio', G: 'Giada' };
  var uid = 100;
  var DAY = 86400000;
  function daysAgo(n) { return Date.now() - n * DAY; }

  var state = {
    films: [
      { id: 1, title: 'Elf', year: 2003, kind: 'Film', genre: 'Commedia', proposed: 0, both: 0, active: true },
      { id: 2, title: 'Mamma, ho perso l\'aereo', year: 1990, kind: 'Film', genre: 'Commedia', proposed: 0, both: 0, active: true },
      { id: 3, title: 'Love Actually', year: 2003, kind: 'Film', genre: 'Romantico', proposed: 0, both: 0, active: true },
      { id: 4, title: 'Il Grinch', year: 2000, kind: 'Film', genre: 'Fantasy', proposed: 0, both: 0, active: true },
      { id: 5, title: 'Una poltrona per due', year: 1983, kind: 'Film', genre: 'Commedia', proposed: 0, both: 0, active: true },
      { id: 6, title: 'The Holiday', year: 2006, kind: 'Film', genre: 'Romantico', proposed: 0, both: 0, active: true },
      { id: 7, title: 'Klaus', year: 2019, kind: 'Film', genre: 'Animazione', proposed: 0, both: 0, active: true },
      { id: 8, title: 'Last Christmas', year: 2019, kind: 'Film', genre: 'Romantico', proposed: 0, both: 0, active: true },
      { id: 9, title: 'Die Hard', year: 1988, kind: 'Film', genre: 'Azione', proposed: 0, both: 0, active: true },
      { id: 10, title: 'Mercoledì', year: 2022, kind: 'Serie TV', genre: 'Fantasy', proposed: 0, both: 0, active: true },
      { id: 11, title: 'Carol', year: 2015, kind: 'Film', genre: 'Drammatico', proposed: 0, both: 0, active: true },
      { id: 12, title: 'Piccole donne', year: 2019, kind: 'Film', genre: 'Drammatico', proposed: 0, both: 0, active: true }
    ],
    seen: [],
    proposals: [],
    gift: null,
    view: window.innerWidth >= 900 ? 'both' : 'A',

    var who = state.view === 'both' ? ['A', 'G'] : [state.view];
    panesEl.className = 'panes' + (who.length > 1 ? ' two' : '');
    panesEl.innerHTML = who.map(function (w) { return '<article class="phone" aria-label="Vista di ' + NAMES[w] + '">' + paneHTML(w) + '</article>'; }).join('');
    Object.keys(keep).forEach(function (id) { var el = document.getElementById(id); if (el) el.value = keep[id]; });
    if (focusSel) { var f = panesEl.querySelector(focusSel); if (f) f.focus(); }
    else if (activeId) { var a = document.getElementById(activeId); if (a) a.focus(); }
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === state.view)); });
    lastDay = today().getTime();
    save();
  }

  /* ---------- regalo ---------- */
  var giftEl = document.getElementById('gift');
  function showGift(fid) {
    var f = film(fid); if (!f) return;
    state.gift = fid;
    var giftSeed = ''; state.proposals.forEach(function (pp) { if (pp.fid === fid) giftSeed = pp.seed || ''; });
    var cols = ['var(--berry)', '#f2c14e', '#3ddc97', '#ffffff'], parts = '';
    for (var i = 0; i < 34; i++) {
      var a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 120;
      parts += '<i style="--dx:' + (Math.cos(a) * d).toFixed(0) + 'px;--dy:' + (Math.sin(a) * d - 50).toFixed(0) + 'px;--r:' + (Math.random() * 540 - 270).toFixed(0) + 'deg;--c:' + cols[i % 4] + ';animation-delay:' + (0.55 + Math.random() * 0.12).toFixed(2) + 's"></i>';
    }
    var meta = f.kind + (f.year ? ' · ' + f.year : '') + (f.genre ? ' · ' + f.genre : '');
    giftEl.innerHTML = '<div class="gift-card"><p class="kicker">Piace a tutti e due</p>' +
      '<div class="stage"><svg class="box" viewBox="0 0 140 140" aria-hidden="true">' +
      '<rect x="14" y="56" width="112" height="78" rx="6" fill="#c0283d"/><rect x="62" y="56" width="16" height="78" fill="#f2c14e"/>' +
      '<g class="lid"><rect x="8" y="36" width="124" height="26" rx="6" fill="#d6384d"/><rect x="62" y="36" width="16" height="26" fill="#f2c14e"/>' +
      '<path d="M70 36C52 8 30 14 40 30c6 8 22 6 30 6zM70 36c18-28 40-22 30-6-6 8-22 6-30 6z" fill="#f2c14e"/></g></svg>' +
      '<div class="burst" aria-hidden="true">' + parts + '</div>' +
      '<div class="reveal">' + artBox(f, false, giftSeed) + '<p class="sub">Stasera guardiamo</p><h3 class="ptitle">' + esc(f.title) + '</h3><p class="sub">' + esc(meta) + '</p></div></div>' +
      '<div class="gift-actions"><button class="confirm" data-act="confirm">Conferma</button><button class="undo" data-act="undo">Ripensaci</button></div></div>';
    giftEl.hidden = false;
    var c = giftEl.querySelector('.confirm'); if (c) c.focus();
  }
  function hideGift() { giftEl.hidden = true; giftEl.innerHTML = ''; state.gift = null; }

  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, 2600); }

  /* ---------- azioni ---------- */
  function onAct(act, el) {
    var w = el.getAttribute('data-w'), i = el.getAttribute('data-i'), v = el.getAttribute('data-v');
    if (act === 'reset') {
      if (!resetArmed) { resetArmed = true; el.textContent = 'Sicuro? Tocca di nuovo'; setTimeout(function () { resetArmed = false; el.textContent = 'Ricomincia da capo'; }, 4000); return; }
      try { localStorage.removeItem(KEY); } catch (e) {}
      location.reload(); return;
    }
    if (act === 'view') { state.view = v; render(); return; }
    if (act === 'tab') { state.tab[w] = v; render('[data-act="tab"][data-w="' + w + '"][data-v="' + v + '"]'); return; }
    if (act === 'redraw') { draw(); render(); toast('Nuove proposte pronte'); return; }
    if (act === 'vote') {
      var p = state.proposals[+i]; if (!p) return;
      var val = v === '1';
      p.votes[w] = p.votes[w] === val ? null : val;
      var done = p.votes.A === true && p.votes.G === true;
      if (done) { var f = film(p.fid); if (f) f.both++; }
      render('[data-act="vote"][data-w="' + w + '"][data-i="' + i + '"][data-v="' + v + '"]');
      if (done) showGift(p.fid);
      return;
    }
    if (act === 'add') {
      var inp = document.getElementById('inp-' + w), kind = document.getElementById('kind-' + w);
      var t = inp.value.trim();
      if (!t) { toast('Scrivi il titolo da aggiungere'); inp.focus(); return; }
      state.films.push({ id: ++uid, title: t, year: null, kind: kind.value, genre: '', proposed: 0, both: 0, active: true });
      inp.value = '';
      if (state.proposals.length < 4) refillOne();
      render('#inp-' + w);
      toast('Aggiunto: ' + t);
      return;
    }
    if (act === 'remove') {
      var f2 = film(+i); if (!f2) return;
      f2.active = false;
      var idx = -1;
      state.proposals.forEach(function (pp, k) { if (pp.fid === f2.id) idx = k; });
      if (idx >= 0) { state.proposals.splice(idx, 1); refillOne(); }
      render();
      toast('Rimosso: ' + f2.title);
      return;
    }
    if (act === 'rate') {
      var s = state.seen[+i]; if (!s) return;
      var n = +v; s.ratings[w] = s.ratings[w] === n ? null : n;
      render('[data-act="rate"][data-w="' + w + '"][data-i="' + i + '"][data-v="' + v + '"]');
      return;
    }
    if (act === 'confirm') {
      var fid = state.gift, ff = film(fid); if (!ff) return;
      var sd = ''; state.proposals.forEach(function (pp) { if (pp.fid === fid) sd = pp.seed || ''; });
      if (!isSeen(fid)) state.seen.unshift({ fid: fid, seed: sd, date: Date.now(), ratings: { A: null, G: null } });
      hideGift(); draw(); render();
      toast('Confermato: ' + ff.title + '. Buona visione!');
      return;
    }
    if (act === 'undo') {
      state.proposals.forEach(function (pp) { if (pp.fid === state.gift) pp.votes = { A: null, G: null }; });
      hideGift(); render();
      return;
    }
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el) onAct(el.getAttribute('data-act'), el);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('.add input')) {
      e.preventDefault();
      var b = e.target.closest('form').querySelector('[data-act="add"]');
      if (b) onAct('add', b);
    }
    if (e.key === 'Escape' && !giftEl.hidden) onAct('undo', giftEl);
  });
  document.addEventListener('submit', function (e) { e.preventDefault(); });

  /* aggiorna il calendario quando cambia il giorno */
  setInterval(function () { if (today().getTime() !== lastDay && giftEl.hidden) render(); }, 60000);

  /* ---------- neve ---------- */
  var cv = document.getElementById('snow'), cx = cv.getContext('2d'), flakes = [];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
  function isDark() { var t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : darkMQ.matches; }
  function size() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  function seed() { flakes = []; var n = Math.round(Math.min(90, window.innerWidth / 12)); for (var i = 0; i < n; i++) flakes.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: 1 + Math.random() * 2.4, s: .3 + Math.random() * .8, d: Math.random() * Math.PI * 2 }); }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    cx.fillStyle = isDark() ? 'rgba(255,255,255,.7)' : 'rgba(60,120,100,.35)';
    flakes.forEach(function (f) {
      f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .4;
      if (f.y > cv.height + 5) { f.y = -5; f.x = Math.random() * cv.width; }
      cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.283); cx.fill();
    });
    requestAnimationFrame(tick);
  }
  size(); seed();
  window.addEventListener('resize', function () { size(); seed(); });
  if (!reduce) requestAnimationFrame(tick);

  var SANTA = '<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M8 120C8 98 32 92 60 92s52 6 52 28z" fill="#c0283d"/><rect x="8" y="112" width="104" height="8" fill="#fff"/><circle cx="60" cy="62" r="24" fill="#f7c9a0"/><path d="M33 62C28 104 92 104 87 62 80 76 70 80 60 80S40 76 33 62z" fill="#fff"/><path d="M43 71C50 64 56 68 60 71 64 68 70 64 77 71 70 79 50 79 43 71z" fill="#fff"/><circle cx="60" cy="65" r="4" fill="#e8847a"/><circle cx="51" cy="55" r="2.2" fill="#222"/><circle cx="69" cy="55" r="2.2" fill="#222"/><path d="M33 50C33 24 58 10 76 22c8 6 11 16 11 28z" fill="#c0283d"/><rect x="31" y="46" width="58" height="10" rx="5" fill="#fff"/><circle cx="78" cy="19" r="7" fill="#fff"/></svg>';
  var ELF = '<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M8 120C8 98 32 92 60 92s52 6 52 28z" fill="#1f8a5a"/><rect x="44" y="92" width="32" height="8" fill="#c0283d"/><path d="M36 58L18 50 36 74z" fill="#f7c9a0"/><path d="M84 58L102 50 84 74z" fill="#f7c9a0"/><circle cx="60" cy="64" r="25" fill="#f7c9a0"/><circle cx="48" cy="70" r="4" fill="#ff9aa8" opacity=".7"/><circle cx="72" cy="70" r="4" fill="#ff9aa8" opacity=".7"/><circle cx="51" cy="58" r="2.2" fill="#222"/><circle cx="69" cy="58" r="2.2" fill="#222"/><path d="M50 74Q60 84 70 74" fill="none" stroke="#a5392f" stroke-width="2.4" stroke-linecap="round"/><path d="M34 56C36 26 62 8 98 14 82 22 82 38 86 56z" fill="#2fa36b"/><rect x="33" y="52" width="54" height="9" rx="4" fill="#c0283d"/><circle cx="98" cy="14" r="6" fill="#f2c14e"/></svg>';
  var LINES = [['Ho ho ho! Buona scelta!', 'santa'], ['Avete deciso? Il tempo vola!', 'santa'], ['Plaid e cioccolata calda!', 'santa'], ['Pop corn pronti?', 'elf'], ['Io voto per la commedia!', 'elf'], ['Un po\' di neve in più?', 'elf']];
  var peekEl = document.getElementById('peek'), bubbleEl = document.getElementById('bubble'), charEl = document.getElementById('char');
  function schedulePeek(delay) {
    setTimeout(function () {
      if (!giftEl.hidden) { schedulePeek(8000); return; }
      var L = LINES[Math.floor(Math.random() * LINES.length)];
      charEl.innerHTML = L[1] === 'santa' ? SANTA : ELF;
      bubbleEl.textContent = L[0];
      peekEl.classList.add('show');
      setTimeout(function () { peekEl.classList.remove('show'); schedulePeek(20000 + Math.random() * 20000); }, 4800);
    }, delay);
  }
  if (!reduce) schedulePeek(6000);

  if (!load() || !state.proposals.length) draw();
  render();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
